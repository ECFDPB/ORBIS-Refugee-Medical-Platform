<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>NHS Navigator — ORBIS</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/i18n.js?v=2"></script>
  <style>
    .phone-frame {
      background: url('/static/img/photos3.png') center center / cover no-repeat;
    }
    .nav-title-wrap { display:flex; flex-direction:column; line-height:1.3; }
    .nav-title-primary { font-size:16px; font-weight:700; color:var(--text-dark); }
    .nav-title-secondary { font-size:12px; color:var(--text-muted); font-weight:400; }

    /* Chat container — fills space between nav and input */
    .chat-wrap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
    }

    /* Scrollable message area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Chat bubble row */
    .bubble-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .bubble-row.user { flex-direction: row-reverse; }

    /* Avatar */
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* Bubble */
    .bubble {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .bubble.ai {
      background: #3a9e6e;
      color: white;
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: #1a4fa8;
      color: white;
      border-bottom-right-radius: 4px;
    }

    /* Typing indicator */
    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 10px 14px;
    }
    .typing-dots span {
      width: 7px; height: 7px;
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* Input bar */
    .chat-input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.95);
      border-top: 1px solid #dde4ea;
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      border: 1.5px solid #b8d4f0;
      border-radius: 20px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      background: #f4f8fd;
      color: var(--text-dark);
      resize: none;
      max-height: 80px;
      overflow-y: auto;
    }
    .chat-input:focus { border-color: var(--nhs-blue); }
    .send-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--nhs-blue);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn svg { width:18px; height:18px; fill:white; }

    /* Chat glass panel */
    .chat-panel {
      position: absolute;
      top: 72px;   /* below nav-bar */
      left: 14px;
      right: 14px;
      bottom: 120px;
      background: rgba(220, 235, 250, 0.55);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Input bar sits below the panel */
    .chat-input-outer {
      position: absolute;
      bottom: 60px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
  </style>
</head>
<body>
<div class="phone-frame">
  <!-- Nav bar -->
  <div class="nav-bar" style="position:relative;z-index:3;">
    <button class="nav-back" onclick="navigateTo('/home')">←</button>
    <div class="nav-title-wrap">
      <span class="nav-title-primary" id="nav-title-primary"></span>
      <span class="nav-title-secondary" id="nav-title-secondary"></span>
    </div>
  </div>

  <!-- Chat panel -->
  <div class="chat-panel">
    <div class="chat-messages" id="chat-messages"></div>
  </div>

  <!-- Input bar -->
  <div class="chat-input-outer">
    <textarea class="chat-input" id="chat-input" rows="1"></textarea>
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script src="/static/js/api.js?v=2"></script>
<script src="/static/js/transition.js"></script>
<script>
  if (!localStorage.getItem('access_token')) window.location.href = '/login';

  let isWaiting = false;

  function render() {
    const lang = getLang();
    document.getElementById('nav-title-primary').textContent = t('nhs_nav');
    document.getElementById('nav-title-secondary').textContent = lang === 'en' ? '' : T['en']['nhs_nav'];
    document.getElementById('chat-input').placeholder = t('chat_placeholder') || 'Ask a question…';
    // Welcome message if empty
    if (document.getElementById('chat-messages').children.length === 0) {
      addAIBubble(t('chat_welcome') || 'Hello! I\'m your NHS Navigator. Ask me anything about NHS services, your rights, or how to access care.');
    }
  }

  function addUserBubble(text) {
    const row = document.createElement('div');
    row.className = 'bubble-row user';
    // avatar first in DOM, row-reverse puts it on the right
    row.innerHTML = `
      <img class="avatar" src="/static/img/icon 4.png" alt="you">
      <div class="bubble user">${escHtml(text)}</div>
    `;
    document.getElementById('chat-messages').appendChild(row);
    scrollBottom();
  }

  function addAIBubble(text) {
    const row = document.createElement('div');
    row.className = 'bubble-row ai';
    row.innerHTML = `
      <img class="avatar" src="/static/img/icon3.png" alt="AI">
      <div class="bubble ai">${escHtml(text)}</div>
    `;
    document.getElementById('chat-messages').appendChild(row);
    scrollBottom();
    return row;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'bubble-row ai';
    row.id = 'typing-indicator';
    row.innerHTML = `
      <img class="avatar" src="/static/img/icon3.png" alt="AI">
      <div class="bubble ai typing-dots">
        <span></span><span></span><span></span>
      </div>
    `;
    document.getElementById('chat-messages').appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function scrollBottom() {
    const el = document.getElementById('chat-messages');
    el.scrollTop = el.scrollHeight;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  async function sendMessage() {
    if (isWaiting) return;
    const input = document.getElementById('chat-input');
    const question = input.value.trim();
    if (!question) return;

    input.value = '';
    input.style.height = 'auto';
    addUserBubble(question);
    isWaiting = true;
    showTyping();

    try {
      const res = await API.navigatorAsk(question);
      removeTyping();
      addAIBubble(res.answer);
    } catch(e) {
      removeTyping();
      console.error('Navigator error:', e);
      addAIBubble('Sorry, something went wrong: ' + e.message);
    }
    isWaiting = false;
  }

  // Send on Enter (Shift+Enter for newline)
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  document.getElementById('chat-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 80) + 'px';
  });

  render();
</script>
</body>
</html>
