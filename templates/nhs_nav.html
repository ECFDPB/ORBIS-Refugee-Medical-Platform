<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>NHS Navigator — ORBIS</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/i18n.js?v=5"></script>
  <style>
    .phone-frame { background: url('/static/img/photos3.png') center center / cover no-repeat; }
    .nav-title-wrap { display:flex; flex-direction:column; line-height:1.3; }
    .nav-title-primary { font-size:16px; font-weight:700; color:var(--text-dark); }
    .nav-title-secondary { font-size:12px; color:var(--text-muted); font-weight:400; }

    .chat-panel {
      position: absolute;
      top: 72px;
      left: 14px;
      right: 14px;
      bottom: 120px;
      background: rgba(220,235,250,0.55);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble-row { display:flex; align-items:flex-end; gap:8px; }
    .bubble-row.user { flex-direction:row-reverse; }
    .avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0; }
    .bubble {
      max-width: 72%; padding: 10px 14px; border-radius: 18px;
      font-size: 14px; line-height: 1.5; word-break: break-word; white-space: pre-wrap;
    }
    .bubble.ai  { background:#3a9e6e; color:white; border-bottom-left-radius:4px; }
    .bubble.user{ background:#1a4fa8; color:white; border-bottom-right-radius:4px; }

    /* Sources */
    .sources-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 4px 0 0 40px;
    }
    .source-chip {
      font-size: 11px; padding: 3px 8px; border-radius: 10px;
      background: rgba(255,255,255,0.85); color: #005EB8;
      text-decoration: none; border: 1px solid #b8d4f0;
    }
    .source-chip:hover { background: #e8f0fb; }

    /* Typing dots */
    .typing-dots { display:flex; gap:4px; padding:10px 14px; }
    .typing-dots span {
      width:7px; height:7px; background:rgba(255,255,255,0.8);
      border-radius:50%; animation:bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2){ animation-delay:.2s; }
    .typing-dots span:nth-child(3){ animation-delay:.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    /* Input bar */
    .chat-input-outer {
      position: absolute;
      bottom: 60px; left: 14px; right: 14px;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
    .chat-input {
      flex: 1; border: 1.5px solid #b8d4f0; border-radius: 20px;
      padding: 10px 14px; font-size: 14px; outline: none;
      background: #f4f8fd; color: var(--text-dark);
      resize: none; max-height: 80px; overflow-y: auto;
    }
    .chat-input:focus { border-color: var(--nhs-blue); }
    .icon-btn {
      width:38px; height:38px; border-radius:50%; border:none;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:opacity 0.2s;
    }
    .icon-btn:hover { opacity:0.85; }
    .send-btn  { background: var(--nhs-blue); }
    .mic-btn   { background: #2e9e6e; }
    .mic-btn.recording { background: #d5281b; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    .icon-btn svg { width:18px; height:18px; fill:white; }
  </style>
</head>
<body>
<div class="phone-frame">
  <div class="nav-bar" style="position:relative;z-index:3;">
    <button class="nav-back" onclick="navigateTo('/home')">←</button>
    <div class="nav-title-wrap">
      <span class="nav-title-primary" id="nav-title-primary"></span>
      <span class="nav-title-secondary" id="nav-title-secondary"></span>
    </div>
  </div>

  <div class="chat-panel">
    <div class="chat-messages" id="chat-messages"></div>
  </div>

  <div class="chat-input-outer">
    <!-- Mic button -->
    <button class="icon-btn mic-btn" id="mic-btn" onclick="toggleMic()" title="Voice input">
      <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 17.93V21h-2v2h6v-2h-2v-2.07A8 8 0 0 0 20 11h-2a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93z"/></svg>
    </button>
    <textarea class="chat-input" id="chat-input" rows="1"></textarea>
    <button class="icon-btn send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script src="/static/js/api.js?v=5"></script>
<script src="/static/js/transition.js"></script>
<script>
  if (!localStorage.getItem('access_token')) window.location.href = '/login';

  let isWaiting = false;
  let recognition = null;
  let isRecording = false;

  // ── Speech Recognition setup ──────────────────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = function(e) {
      const transcript = e.results[0][0].transcript;
      document.getElementById('chat-input').value = transcript;
      stopMic();
      sendMessage();
    };
    recognition.onerror = function() { stopMic(); };
    recognition.onend = function() { stopMic(); };
  }

  function toggleMic() {
    if (!recognition) { alert('Voice input not supported in this browser.'); return; }
    if (isRecording) { stopMic(); } else { startMic(); }
  }
  function startMic() {
    isRecording = true;
    document.getElementById('mic-btn').classList.add('recording');
    recognition.lang = getLangBCP47();
    recognition.start();
  }
  function stopMic() {
    isRecording = false;
    document.getElementById('mic-btn').classList.remove('recording');
    try { recognition.stop(); } catch(e) {}
  }

  // Map our lang codes to BCP-47 for speech recognition
  function getLangBCP47() {
    const map = { zh:'zh-CN', en:'en-GB', es:'es-ES', pl:'pl-PL', ro:'ro-RO' };
    return map[getLang()] || 'en-GB';
  }

  // ── Text-to-Speech ────────────────────────────────────────────────────────
  // (disabled)

  // ── Render ────────────────────────────────────────────────────────────────
  function render() {
    const lang = getLang();
    document.getElementById('nav-title-primary').textContent = t('nhs_nav');
    document.getElementById('nav-title-secondary').textContent = lang === 'en' ? '' : T['en']['nhs_nav'];
    document.getElementById('chat-input').placeholder = t('chat_placeholder') || 'Ask a question…';
    if (document.getElementById('chat-messages').children.length === 0) {
      const welcome = t('chat_welcome') || 'Hello! I\'m your NHS Navigator.';
      addAIBubble(welcome, []);
    }
  }

  // ── Bubble helpers ────────────────────────────────────────────────────────
  function addUserBubble(text) {
    const row = document.createElement('div');
    row.className = 'bubble-row user';
    row.innerHTML = `<img class="avatar" src="/static/img/icon 4.png" alt="you">
      <div class="bubble user">${escHtml(text)}</div>`;
    document.getElementById('chat-messages').appendChild(row);
    scrollBottom();
  }

  function addAIBubble(text, sources) {
    // Message row
    const row = document.createElement('div');
    row.className = 'bubble-row ai';
    row.innerHTML = `<img class="avatar" src="/static/img/icon3.png" alt="AI">
      <div class="bubble ai">${escHtml(text)}</div>`;
    document.getElementById('chat-messages').appendChild(row);

    // Sources row
    if (sources && sources.length > 0) {
      const srow = document.createElement('div');
      srow.className = 'sources-row';
      sources.forEach(function(s) {
        const a = document.createElement('a');
        a.className = 'source-chip';
        a.href = s.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = '🔗 ' + s.label;
        srow.appendChild(a);
      });
      document.getElementById('chat-messages').appendChild(srow);
    }

    scrollBottom();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'bubble-row ai';
    row.id = 'typing-indicator';
    row.innerHTML = `<img class="avatar" src="/static/img/icon3.png" alt="AI">
      <div class="bubble ai typing-dots"><span></span><span></span><span></span></div>`;
    document.getElementById('chat-messages').appendChild(row);
    scrollBottom();
  }
  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }
  function scrollBottom() {
    const el = document.getElementById('chat-messages');
    el.scrollTop = el.scrollHeight;
  }
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  // ── Send message ──────────────────────────────────────────────────────────
  async function sendMessage() {
    if (isWaiting) return;
    const input = document.getElementById('chat-input');
    const question = input.value.trim();
    if (!question) return;

    input.value = '';
    input.style.height = 'auto';
    addUserBubble(question);
    isWaiting = true;
    showTyping();

    try {
      const res = await API.navigatorAsk(question);
      removeTyping();
      addAIBubble(res.answer, res.sources || []);
    } catch(e) {
      removeTyping();
      addAIBubble('Sorry, something went wrong: ' + e.message, []);
    }
    isWaiting = false;
  }

  document.getElementById('chat-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  document.getElementById('chat-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 80) + 'px';
  });

  render();
</script>
</body>
</html>
