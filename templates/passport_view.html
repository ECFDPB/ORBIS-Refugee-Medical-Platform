<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>Passport — ORBIS</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/i18n.js"></script>
  <style>
    .phone-frame { background: url('/static/img/photos3.png') center center / cover no-repeat; }
    .nav-title-wrap {
      display: flex;
      flex-direction: column;
      line-height: 1.3;
    }
    .nav-title-primary {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
    }
    .nav-title-secondary {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }
    .field-label-primary {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .field-label-secondary {
      font-size: 11px;
      color: #8fa3b1;
      font-weight: 400;
      margin-top: 2px;
    }
  </style>
</head>
<body>
<div class="phone-frame">
  <div class="page-content">
    <div class="nav-bar">
      <button class="nav-back" onclick="navigateTo('/home')">←</button>
      <div class="nav-title-wrap">
        <span class="nav-title-primary" id="nav-title-primary"></span>
        <span class="nav-title-secondary" id="nav-title-secondary"></span>
      </div>
    </div>
    <div class="card" id="passport-card">
      <div style="text-align:center;padding:20px 0;color:var(--text-muted);" id="loading-msg"></div>
    </div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/transition.js"></script>
<script>
  if (!localStorage.getItem('access_token')) window.location.href = '/login';

  const FIELDS = [
    ['field_conditions', 'conditions'],
    ['field_medications', 'medications'],
    ['field_allergies', 'allergies'],
    ['field_red_flags', 'red_flags'],
    ['field_tests', 'tests'],
    ['field_follow_up', 'follow_up'],
    ['field_summary', 'summary_plain_english'],
  ];

  function render() {
    const lang = getLang();
    document.getElementById('nav-title-primary').textContent = t('passport_title');
    document.getElementById('nav-title-secondary').textContent = lang === 'en' ? '' : T['en']['passport_title'];

    // Build bilingual two-line "no passport" message
    function splitSentences(str) {
      // Split on '. ' or '。' keeping both parts
      const idx = str.search(/\.\s+|。/);
      if (idx === -1) return [str, ''];
      const first = str.slice(0, idx + 1).trim();
      const second = str.slice(idx + 1).trim();
      return [first, second];
    }

    const noNative = t('no_passport');
    const noEn = T['en']['no_passport'];

    let msgHtml;
    if (lang === 'zh') {
      const [e1, e2] = splitSentences(noEn);
      msgHtml = `<span>${noNative}</span><br>`
              + `<span style="font-size:12px;color:#8fa3b1;">${e1}</span><br>`
              + `<span style="font-size:12px;color:#8fa3b1;">${e2}</span>`;
    } else if (lang === 'en') {
      const [s1, s2] = splitSentences(noEn);
      msgHtml = `<span>${s1}</span><br><span>${s2}</span>`;
    } else {
      const [n1, n2] = splitSentences(noNative);
      const [e1, e2] = splitSentences(noEn);
      msgHtml = `<span>${n1}</span><br><span>${n2}</span><br>`
              + `<span style="font-size:12px;color:#8fa3b1;">${e1}</span><br>`
              + `<span style="font-size:12px;color:#8fa3b1;">${e2}</span>`;
    }
    document.getElementById('loading-msg').innerHTML = msgHtml;
  }

  async function loadPassport() {
    try {
      const data = await API.getMergedPassport();
      renderPassport(data);
    } catch(e) {
      // re-use the same bilingual render so it doesn't get overwritten
      render();
    }
  }

  function renderPassport(data) {
    const lang = getLang();
    let html = '<table class="passport-table">';
    FIELDS.forEach(([labelKey, dataKey]) => {
      const val = data[dataKey];
      if (!val || (Array.isArray(val) && val.length === 0)) return;

      // Two-line label: native language on top, English below
      const labelNative = t(labelKey);
      const labelEn = T['en'][labelKey];
      const labelHtml = lang === 'en'
        ? `<div class="field-label-primary">${labelNative}</div>`
        : `<div class="field-label-primary">${labelNative}</div><div class="field-label-secondary">${labelEn}</div>`;

      let cellContent;
      if (dataKey === 'red_flags' && Array.isArray(val)) {
        cellContent = val.map(f => `<span class="red-flag-badge">${f}</span>`).join(' ');
      } else if (Array.isArray(val)) {
        cellContent = val.map(v => `<div style="margin-bottom:3px;">• ${v}</div>`).join('');
      } else {
        cellContent = val;
      }
      html += `<tr><td>${labelHtml}</td><td>${cellContent}</td></tr>`;
    });
    html += '</table>';
    document.getElementById('passport-card').innerHTML = html;
  }

  render();
  loadPassport();
</script>
</body>
</html>
