<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>Login — ORBIS</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/i18n.js"></script>
  <style>
    .phone-frame {
      background: url('/static/img/photos2.png') center center / cover no-repeat;
    }
    .login-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px 24px;
      gap: 14px;
      margin-top: -60px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 12px;
    }
    .login-logo-title {
      font-size: 64px;
      font-weight: 800;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .login-logo-sub {
      font-size: 13px;
      color: #c8102e;
      margin-top: 4px;
    }
    .input-field {
      background: rgba(240,244,248,0.92);
      border: none;
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 16px;
      color: var(--text-dark);
      width: 100%;
      outline: none;
    }
    .input-field:focus {
      background: rgba(255,255,255,0.98);
      box-shadow: 0 0 0 2px var(--nhs-blue);
    }
    /* Language dropdown */
    .lang-select-wrap {
      position: relative;
    }
    .lang-select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(240,244,248,0.92);
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      color: var(--text-dark);
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      outline: none;
    }
    .lang-select:focus {
      background: rgba(255,255,255,0.98);
      box-shadow: 0 0 0 2px var(--nhs-blue);
    }
    .lang-select-arrow {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
      font-size: 14px;
    }
    .lang-label {
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .btn-login {
      width: 100%;
      padding: 15px;
      background: #c8102e;
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 4px;
    }
    .btn-login:hover { opacity: 0.88; }
    .error-msg {
      background: rgba(253,232,230,0.95);
      color: #d5281b;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
<div class="phone-frame">
  <div class="login-wrap">
    <div class="login-logo">
      <div class="login-logo-title">ORBIS</div>
    </div>

    <input class="input-field" type="text" id="username" placeholder="Email" autocomplete="username">
    <input class="input-field" type="password" id="password" placeholder="Password" autocomplete="current-password">

    <div>
      <div class="lang-label" id="lbl-lang"></div>
      <div class="lang-select-wrap">
        <select class="lang-select" id="lang-select">
        </select>
        <span class="lang-select-arrow">▼</span>
      </div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <button class="btn-login" id="btn-login"></button>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
  function render() {
    document.getElementById('lbl-lang').textContent = t('preferred_lang');
    document.getElementById('username').placeholder = t('username');
    document.getElementById('password').placeholder = t('password');
    document.getElementById('btn-login').textContent = t('login');

    const sel = document.getElementById('lang-select');
    const cur = getLang();
    sel.innerHTML = '';
    LANGUAGES.forEach(l => {
      const opt = document.createElement('option');
      opt.value = l.code;
      opt.textContent = l.label;
      if (l.code === cur) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  document.getElementById('lang-select').addEventListener('change', e => {
    setLang(e.target.value);
    render();
  });

  render();

  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errEl = document.getElementById('error-msg');
    errEl.style.display = 'none';

    try {
      const data = await API.login(email, password);
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('user_email', data.user.email);
      if (data.user.preferred_language) setLang(data.user.preferred_language);
      window.location.href = '/home';
    } catch (e) {
      errEl.textContent = t('login_error');
      errEl.style.display = 'block';
    }
  });

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-login').click();
  });
</script>
</body>
</html>
